# Fallback: only needed if ComicScanner.xcodeproj won't open (e.g. Xcode older than 16).
# brew install xcodegen && xcodegen generate
name: ComicScanner
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  ComicScanner:
    type: application
    platform: iOS
    sources: [ComicScanner]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ComicScanner
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Comic Scanner
        INFOPLIST_KEY_NSCameraUsageDescription: The camera is used to scan comic book barcodes and cover titles.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
