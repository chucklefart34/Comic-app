name: Build comic catalog

# Builds the app's offline Marvel & DC catalog from the comics.org (Grand Comics Database) API, using the
# free account in the repo secrets GCD_EMAIL / GCD_PASSWORD. Runs every day, inside comics.org's limit for
# registered accounts (25 requests a minute, 2,000 a day):
#   - once a week: new and upcoming issues (barcodes, variants, covers) from the on-sale list
#   - first ~3 days: every Marvel & DC series with all its issues and variants
#   - then: cover links for every regular issue (~10 days), then barcodes and variant covers, newest first
on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:
    inputs:
      budget:
        description: "comics.org requests to use in this run (limit 2,000 a day)"
        default: "1800"
      publishers:
        description: "Publishers (Marvel, DC, Image, Dark Horse, IDW, BOOM! Studios)"
        default: "Marvel,DC,Image"

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      GCD_EMAIL: ${{ secrets.GCD_EMAIL }}
      GCD_PASSWORD: ${{ secrets.GCD_PASSWORD }}
      CATALOG_PUBLISHERS: ${{ github.event.inputs.publishers || 'Marvel,DC,Image' }}
      PYTHONUNBUFFERED: "1"  # show progress in the log as it happens
    steps:
      - uses: actions/checkout@v4

      - name: Check comics.org login is set
        run: |
          if [ -z "$GCD_EMAIL" ] || [ -z "$GCD_PASSWORD" ]; then
            echo "::error::Add GCD_EMAIL and GCD_PASSWORD under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Get the current catalog
        run: |
          mkdir -p work out
          URL="https://github.com/${{ github.repository }}/releases/download/catalog/catalog.sqlite.deflate"
          if curl -sSfL "$URL" -o work/previous.deflate; then
            python3 scripts/catalog.py unpack work/previous.deflate work/catalog.sqlite
            echo "Continuing the existing catalog"
          else
            echo "Starting a new catalog"
          fi

      - name: Update from comics.org
        run: python3 scripts/catalog.py run work/catalog.sqlite --budget "${{ github.event.inputs.budget || '1800' }}"

      - name: Package
        run: python3 scripts/catalog.py pack work/catalog.sqlite out

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: catalog
          name: Comic catalog (Marvel, DC & Image)
          make_latest: false
          body: |
            Offline catalog the app uses for barcode and cover matching. Updated daily.

            Catalog data from the [Grand Comics Database™](https://www.comics.org), licensed
            [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/). Contains links to GCD cover
            scans, not the images; the app loads a cover only when a scan needs it.
          files: |
            out/catalog.sqlite.deflate
            out/catalog.json
