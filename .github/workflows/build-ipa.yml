name: Build IPA

on:
  push:
    branches: [main]
    paths: ["ComicScanner/**", "ComicScanner.xcodeproj/**", ".github/workflows/build-ipa.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [macos-14, macos-15]
    steps:
      - uses: actions/checkout@v4

      - name: Pick newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project ComicScanner.xcodeproj \
            -target ComicScanner \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Release-iphoneos/ComicScanner.app

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/ComicScanner.app Payload/
          zip -qry ComicScanner.ipa Payload
          ls -lh ComicScanner.ipa

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.os }}
          path: build.log

      - uses: actions/upload-artifact@v4
        with:
          name: ComicScanner-ipa-${{ matrix.os }}
          path: ComicScanner.ipa

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Comic Scanner 1.0 (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: ComicScanner.ipa
          body: |
            Unsigned build of Comic Scanner. Install it with Sideloadly or AltStore, which sign it with your own Apple ID.
            See the README for step-by-step install instructions.
