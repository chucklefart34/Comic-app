name: Build IPA

on:
  push:
    branches: [main]
    paths: ["ComicScanner/**", "ComicScannerTests/**", "ComicScanner.xcodeproj/**", ".github/workflows/build-ipa.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Pick newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Run tests on a simulator
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in data if "iOS" in r), reverse=True)
          for runtime in runtimes:
              for device in data[runtime]:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"]); sys.exit()
          ')
          echo "Simulator: $UDID"
          xcodebuild test \
            -project ComicScanner.xcodeproj \
            -scheme ComicScanner \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO \
            > test.log 2>&1 || STATUS=$?
          grep -E "error:|Test Case .*(passed|failed)|XCTAssert|Executed|TEST (SUCCEEDED|FAILED)" test.log | head -300 || true
          exit ${STATUS:-0}

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log

  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [macos-15]
    steps:
      - uses: actions/checkout@v4

      - name: Pick newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project ComicScanner.xcodeproj \
            -target ComicScanner \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || true
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build.log | sort -u || true
          grep -q "BUILD SUCCEEDED" build.log
          test -f build/Release-iphoneos/ComicScanner.app/ComicScanner

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/ComicScanner.app Payload/
          zip -qry ComicScanner.ipa Payload
          ls -lh ComicScanner.ipa

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.os }}
          path: build.log

      - uses: actions/upload-artifact@v4
        with:
          name: ComicScanner-ipa-${{ matrix.os }}
          path: ComicScanner.ipa

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Comic Scanner 1.0 (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: ComicScanner.ipa
          body: |
            Unsigned build of Comic Scanner. Install it with Sideloadly or AltStore, which sign it with your own Apple ID.
            See the README for step-by-step install instructions.
